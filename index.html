<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BookKaro - Public Booking</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAL-LDI6qvDPqVWNL_tNb53D7kacbpAlAw",
            authDomain: "bookkaro-f549a.firebaseapp.com",
            projectId: "bookkaro-f549a",
            storageBucket: "bookkaro-f549a.firebasestorage.app",
            messagingSenderId: "1067243117950",
            appId: "1:1067243117950:web:c7682b0aca89d0c0a0272f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.submitBooking = async (e) => {
            e.preventDefault();
            const statusMsg = document.getElementById('statusMsg');
            try {
                await addDoc(collection(db, "bookings"), {
                    customerName: document.getElementById('name').value,
                    propertyType: document.getElementById('property').value,
                    status: "Pending",
                    timestamp: serverTimestamp(),
                    alternateOptions: ""
                });
                statusMsg.style.color = "green";
                statusMsg.innerText = "Request sent successfully to BookKaro!";
                e.target.reset();
            } catch (err) {
                statusMsg.innerText = "Error: " + err.message;
            }
        };
    </script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #eee; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h2>BookKaro: Book Your Stay</h2>
    <form onsubmit="submitBooking(event)">
        <input type="text" id="name" placeholder="Full Name" required>
        <select id="property">
            <option value="Cottage">Cottage</option>
            <option value="Villa">Villa</option>
            <option value="Flat">Flat</option>
            <option value="Houseboat">Houseboat</option>
            <option value="Hostel">Hostel</option>
            <option value="Row House">Row House</option>
        </select>
        <button type="submit">Submit Request</button>
    </form>
    <p id="statusMsg"></p>
</body>
</html>
